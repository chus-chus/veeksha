[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "veeksha"
dynamic = ["version"]
description = "A framework for benchmarking LLM Inference Systems"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [
    {name = "Vajra Team"},
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic",
    "transformers",
    "tqdm",
    "ddsketch",
    "wandb",
    "pandas",
    "numpy",
    "jinja2",
    "datasets",
    "sacrebleu",
    "rouge-score",
    "scikit-learn",
    "evaluate",
    "pytablewriter",
    "Pillow",
    "rekha",
    "textual",
    "plotext"
]

[project.urls]
Homepage = "https://github.com/project-vajra/veeksha"
Documentation = "https://project-vajra.github.io/veeksha"

[project.optional-dependencies]
dev = [
    "autoflake",
    "black",
    "codespell",
    "isort",
    "pyright",
    "pytest>=8.0",
    "pytest-cov",
    "requests",
]
test = [
    "pytest>=8.0",
    "pytest-cov",
    "requests",
    "vllm",  # For functional testing with real inference
    "rich",  # For enhanced test reporting
    "torch",  # For GPU test synchronization
    "jinja2",  # For test config templates
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["veeksha*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
veeksha = [
    "data/processed_traces/*",
    "data/corpus.txt",
]

[tool.setuptools_scm]
write_to = "veeksha/_version.py"
version_scheme = "post-release"
local_scheme = "no-local-version"

[tool.isort]
profile = "black"
known_first_party = "veeksha"
known_third_party = "wandb"
extend_skip = ["veeksha/_version.py"]

[tool.pyright]
include = ["veeksha"]
exclude = [
    "**/__pycache__",
    "veeksha/lm_eval/**",
]

[tool.black]
extend-exclude = 'veeksha/_version\.py'
